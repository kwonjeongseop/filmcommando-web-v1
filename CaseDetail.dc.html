<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>필름특공대 — 사례 상세</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  html, body { margin:0; padding:0; background:#F4F1EA; }
  * { box-sizing:border-box; }
  a { color:#1F1B16; text-decoration:none; }
  a:hover { color:#A2543A; }
  ::selection { background:#1F1B16; color:#F4F1EA; }

  /* CaseDetail 반응형 */
  @media (max-width:768px) {
    .fc-cd-wrap {
      min-width:0 !important;
      padding:0 0 80px !important;
    }
    .fc-cd-hero {
      grid-template-columns:minmax(0,1fr) !important;
      padding:40px 20px !important;
    }
    .fc-cd-hero-img {
      height:300px !important;
    }
    .fc-cd-brief {
      grid-template-columns:minmax(0,1fr) !important;
      padding:40px 20px !important;
    }
    .fc-cd-rooms-label {
      grid-template-columns:minmax(0,1fr) !important;
      padding:40px 20px !important;
    }
    .fc-cd-room-wrap {
      grid-template-columns:minmax(0,1fr) !important;
      padding:20px 20px !important;
    }
    .fc-cd-before-after {
      grid-template-columns:minmax(0,1fr) !important;
    }
    .fc-cd-ba-img {
      height:200px !important;
    }
    .fc-cd-log-wrap {
      grid-template-columns:minmax(0,1fr) !important;
      padding:40px 20px !important;
    }
    .fc-cd-review-wrap {
      grid-template-columns:minmax(0,1fr) !important;
      padding:40px 20px !important;
    }
    .fc-cd-cta {
      flex-direction:column !important;
      gap:20px !important;
      padding:40px 20px !important;
    }
  }
  @media (max-width:480px) {
    .fc-cd-hero-img {
      height:220px !important;
    }
    .fc-cd-ba-img {
      height:160px !important;
    }
    .fc-cd-log-row {
      grid-template-columns:minmax(0,1fr) !important;
    }
  }
</style>
<script src="./page-transition.js"></script>
</helmet>

<div class="fc-cd-wrap" style="font-family:'Gowun Dodum',sans-serif; color:#1F1B16; background:#F4F1EA; overflow-x:hidden">
  <dc-import name="SiteHeader" hint-size="100%,113px"></dc-import>

  <section style="padding:28px 56px; border-bottom:1px solid #DCD4C6; font-size:13px; color:#8C8071">
    <a href="./Cases.dc.html" style="color:#8C8071">시공 사례</a>
    &nbsp;/&nbsp;
    <span id="cd-breadcrumb" style="color:#1F1B16"></span>
  </section>

  <section class="fc-cd-hero" style="padding:72px 56px 56px; display:grid; grid-template-columns:190px minmax(0,1fr) minmax(0,320px); gap:56px; align-items:end">
    <div id="cd-scope"
      style="font-size:12px; letter-spacing:0.2em;
      color:#A2543A"></div>
    <h1 id="cd-title"
      style="font-family:'Nanum Myeongjo',serif;
      font-weight:800; font-size:44px; line-height:1.32;
      letter-spacing:-0.04em; margin:0"></h1>
    <div id="cd-facts"
      style="display:flex; flex-direction:column;
      gap:12px"></div>
  </section>

  <section style="padding:0 56px 64px">
    <div id="cd-hero-wrap"
      class="fc-cd-hero-img"
      style="position:relative; height:620px;
      overflow:hidden; background:#E6DFD2">
      <div id="cd-hero-placeholder"
        style="width:100%;height:100%;display:flex;
        align-items:center;justify-content:center;
        font-size:14px;color:#9A8F80">
        사진 준비 중</div>
    </div>
  </section>

  <section style="border-top:1px solid #DCD4C6; border-bottom:1px solid #DCD4C6; background:#EFEADF">
    <div class="fc-cd-brief" style="padding:64px 56px; display:grid; grid-template-columns:190px minmax(0,1fr) minmax(0,1fr); gap:56px">
      <div style="font-size:12px; letter-spacing:0.2em; color:#9A8F80; padding-top:6px">의뢰 내용</div>
      <div id="cd-body-quote"
        style="font-family:'Nanum Myeongjo',serif;
        font-size:21px; line-height:1.9;
        letter-spacing:-0.02em; margin:0;
        text-wrap:pretty"></div>
      <div id="cd-body-detail"
        style="font-size:15.5px; line-height:2;
        color:#5D5346; text-wrap:pretty"></div>
    </div>
  </section>

  <section style="padding:72px 56px 40px">
    <div class="fc-cd-rooms-label" style="display:grid; grid-template-columns:190px minmax(0,1fr); gap:56px; margin-bottom:12px">
      <div style="font-size:12px; letter-spacing:0.2em; color:#9A8F80">전 · 후</div>
      <h2 style="font-family:'Nanum Myeongjo',serif; font-size:30px; font-weight:700; letter-spacing:-0.03em; margin:0">공간별 변화</h2>
    </div>
    <div id="cd-rooms"></div>
  </section>

  <section style="background:#EFEADF; border-top:1px solid #DCD4C6; border-bottom:1px solid #DCD4C6">
    <div class="fc-cd-log-wrap" style="padding:72px 56px; display:grid; grid-template-columns:190px minmax(0,1fr) minmax(0,380px); gap:56px">
      <div style="font-size:12px; letter-spacing:0.2em; color:#9A8F80; padding-top:6px">공정 기록</div>
      <div>
        <div id="cd-log"></div>
      </div>
      <div style="background:#F4F1EA; padding:32px 30px; align-self:start">
        <div style="font-size:12px; letter-spacing:0.16em; color:#9A8F80; margin-bottom:18px">사용 자재</div>
        <div id="cd-materials"></div>
        <a href="./Materials.dc.html" style="display:inline-block; margin-top:20px; font-size:14px; border-bottom:1px solid #C9C0B0; padding-bottom:4px">자재 쇼룸에서 보기</a>
      </div>
    </div>
  </section>

  <section class="fc-cd-review-wrap" style="padding:72px 56px; display:grid; grid-template-columns:190px minmax(0,1fr) minmax(0,1fr); gap:56px; align-items:start">
    <div style="font-size:12px; letter-spacing:0.2em; color:#9A8F80; padding-top:6px">고객 후기</div>
    <p id="cd-review-body"
      style="font-family:'Nanum Myeongjo',serif;
      font-size:22px; line-height:1.9;
      letter-spacing:-0.02em; margin:0;
      text-wrap:pretty"></p>
    <div id="cd-review-meta"
      style="font-size:14px; color:#9A8F80;
      line-height:1.9; padding-top:6px">
      <a href="./Review.dc.html"
        style="display:block; margin-top:18px;
        font-size:14px; border-bottom:1px solid #C9C0B0;
        padding-bottom:4px; width:fit-content">
        후기 전체 보기</a>
    </div>
  </section>

  <section style="background:#221E19; color:#EDE7DC">
    <div class="fc-cd-cta" style="padding:70px 56px; display:flex; justify-content:space-between; align-items:center; gap:40px">
      <div>
        <h2 style="font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:31px; letter-spacing:-0.035em; margin:0 0 12px; color:#F7F3EA">비슷한 조건의 집을 보여드립니다</h2>
        <p style="font-size:15px; line-height:1.9; color:#B0A595; margin:0">평형과 연식을 알려주시면 유사 사례의 견적서와 일정표를 정리해 드립니다.</p>
      </div>
      <div style="display:flex; gap:12px; flex:none">
        <a href="./Cases.dc.html" style="border:1px solid #4A4238; color:#EDE7DC; font-size:15px; padding:18px 28px" style-hover="border-color:#A2543A">다른 사례 보기</a>
        <a href="./Quote.dc.html" style="background:#EDE7DC; color:#221E19; font-size:15px; padding:18px 32px" style-hover="background:#A2543A; color:#F7F3EA">견적 접수</a>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>

<script type="module">
import { db } from './firebase-config.js';
import {
  doc, onSnapshot
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || ''; return d.innerHTML;
}
function imgBox(url, label, h) {
  return url
    ? '<img src="' + esc(url) + '"' +
      ' style="width:100%;height:' + (h||'300px') + ';' +
      'object-fit:cover;display:block"' +
      ' alt="' + esc(label) + '">'
    : '<div style="width:100%;height:' + (h||'300px') + ';' +
      'background:#E6DFD2;display:flex;' +
      'align-items:center;justify-content:center;' +
      'font-size:13px;color:#9A8F80">' +
      esc(label) + '</div>';
}

function renderCase(data) {
  /* 빵부스러기 */
  const bc = document.getElementById('cd-breadcrumb');
  if (bc) bc.textContent = data.title || '';

  /* scope + h1 */
  const scopeEl = document.getElementById('cd-scope');
  if (scopeEl) scopeEl.textContent = data.scope || '';
  const titleEl = document.getElementById('cd-title');
  if (titleEl) titleEl.textContent = data.title || '';

  /* facts */
  const factsEl = document.getElementById('cd-facts');
  if (factsEl && Array.isArray(data.facts)) {
    factsEl.innerHTML = data.facts.map(f =>
      '<div style="display:grid;' +
      'grid-template-columns:80px minmax(0,1fr);' +
      'gap:16px;padding-bottom:11px;' +
      'border-bottom:1px solid #E6DFD2">' +
      '<span style="font-size:12.5px;color:#9A8F80">' +
      esc(f.k) + '</span>' +
      '<span style="font-size:14px;color:#3E362C">' +
      esc(f.v) + '</span></div>'
    ).join('');
  }

  /* 히어로 사진 */
  const heroWrap = document.getElementById('cd-hero-wrap');
  if (heroWrap && data.photoAfter) {
    heroWrap.innerHTML =
      '<img src="' + esc(data.photoAfter) + '"' +
      ' style="width:100%;height:620px;' +
      'object-fit:cover;display:block"' +
      ' alt="준공 사진">';
  }

  /* 의뢰 내용 */
  const quoteEl = document.getElementById('cd-body-quote');
  if (quoteEl) quoteEl.textContent = data.body || '';
  const detailEl = document.getElementById('cd-body-detail');
  if (detailEl) detailEl.textContent = '';

  /* rooms */
  const roomsEl = document.getElementById('cd-rooms');
  if (roomsEl && Array.isArray(data.rooms)) {
    roomsEl.innerHTML = data.rooms.map(r =>
      '<div class="fc-cd-room-wrap"' +
      ' style="display:grid;' +
      'grid-template-columns:190px minmax(0,1fr);' +
      'gap:56px;padding:36px 0;' +
      'border-top:1px solid #DCD4C6">' +
      '<div>' +
      '<div style="font-family:\'Nanum Myeongjo\',' +
      'serif;font-size:20px;letter-spacing:-0.025em;' +
      'margin-bottom:10px">' + esc(r.title) + '</div>' +
      '<div style="font-size:13px;color:#A2543A;' +
      'line-height:1.8">' + esc(r.trades) + '</div>' +
      '</div><div>' +
      '<div style="display:grid;' +
      'grid-template-columns:minmax(0,1fr) minmax(0,1fr);' +
      'gap:24px;margin-bottom:20px">' +
      '<figure style="margin:0">' +
      '<div class="fc-cd-ba-img"' +
      ' style="position:relative;height:300px;' +
      'overflow:hidden">' +
      imgBox(r.photoBefore,'BEFORE','300px') +
      '</div><figcaption style="font-size:12px;' +
      'letter-spacing:0.16em;color:#9A8F80;' +
      'padding-top:12px">BEFORE</figcaption></figure>' +
      '<figure style="margin:0">' +
      '<div class="fc-cd-ba-img"' +
      ' style="position:relative;height:300px;' +
      'overflow:hidden">' +
      imgBox(r.photoAfter,'AFTER','300px') +
      '</div><figcaption style="font-size:12px;' +
      'letter-spacing:0.16em;color:#A2543A;' +
      'padding-top:12px">AFTER</figcaption></figure>' +
      '</div>' +
      '<p style="font-size:15px;line-height:1.95;' +
      'color:#5D5346;margin:0;max-width:820px;' +
      'text-wrap:pretty">' + esc(r.body) + '</p>' +
      '</div></div>'
    ).join('');
  }

  /* log */
  const logEl = document.getElementById('cd-log');
  if (logEl && Array.isArray(data.log)) {
    logEl.innerHTML = data.log.map(l =>
      '<div class="fc-cd-log-row"' +
      ' style="display:grid;' +
      'grid-template-columns:100px minmax(0,1fr) 120px;' +
      'gap:24px;padding:17px 0;' +
      'border-bottom:1px solid #DCD4C6;' +
      'align-items:baseline">' +
      '<div style="font-family:\'Nanum Myeongjo\',' +
      'serif;font-size:15px;color:#A2543A">' +
      esc(l.week) + '</div>' +
      '<div style="font-size:15px;line-height:1.8;' +
      'color:#3E362C">' + esc(l.body) + '</div>' +
      '<div style="font-size:13.5px;color:#8C8071;' +
      'text-align:right">' + esc(l.days) + '</div>' +
      '</div>'
    ).join('');
  }

  /* materials */
  const matEl = document.getElementById('cd-materials');
  if (matEl && Array.isArray(data.materials)) {
    matEl.innerHTML = data.materials.map(m =>
      '<div style="display:grid;' +
      'grid-template-columns:78px minmax(0,1fr);' +
      'gap:16px;padding:11px 0;' +
      'border-bottom:1px solid #E6DFD2">' +
      '<span style="font-size:12.5px;color:#9A8F80">' +
      esc(m.k) + '</span>' +
      '<span style="font-size:14px;color:#3E362C;' +
      'line-height:1.6">' + esc(m.v) + '</span></div>'
    ).join('');
  }

  /* 고객 후기 */
  const rvBody = document.getElementById('cd-review-body');
  if (rvBody) rvBody.textContent = '';
  const rvMeta = document.getElementById('cd-review-meta');
  if (rvMeta) {
    rvMeta.innerHTML =
      '<a href="./Review.dc.html"' +
      ' style="display:block;margin-top:18px;' +
      'font-size:14px;border-bottom:1px solid #C9C0B0;' +
      'padding-bottom:4px;width:fit-content">' +
      '후기 전체 보기</a>';
  }
}

function showNotFound() {
  const titleEl = document.getElementById('cd-title');
  if (titleEl) titleEl.textContent =
    '사례를 찾을 수 없습니다.';
}

function initPage() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) { showNotFound(); return; }
  onSnapshot(doc(db, 'cases', id), snap => {
    if (!snap.exists()) { showNotFound(); return; }
    renderCase(snap.data());
  });
}
if (document.readyState === 'loading') {
  document.addEventListener(
    'DOMContentLoaded', initPage);
} else {
  initPage();
}
</script>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000}}">
class Component extends DCLogic {
  renderVals() { return {}; }
}

</script>
</body>
</html>
