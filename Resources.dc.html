<script type="module">
import { db } from './firebase-config.js';
import { initAuthObserver } from './auth.js';
import {
  collection, query, orderBy, onSnapshot, addDoc, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const GITHUB_PREFIX = 'https://github.com/';
const FORM_INPUT_STYLE = 'border:1px solid #C9C0B0; background:#F4F1EA; padding:10px 12px; font-size:14px; font-family:inherit; color:#1F1B16';

function col(...path) { return collection(db, ...path); }

function todayIso() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

let latestResources = [];

const listEl       = document.getElementById('resource-list');
const emptyEl       = document.getElementById('resource-empty');
const adminPanelEl = document.getElementById('resource-admin-panel');

// ── 자료 목록 — Firestore 실시간 연동 ─────────────
const resourcesQuery = query(col('resources'), orderBy('no', 'desc'));
onSnapshot(resourcesQuery, (snap) => {
  latestResources = [];
  listEl.textContent = '';
  if (snap.empty) {
    emptyEl.textContent = '등록된 자료가 없습니다.';
    emptyEl.style.display = '';
  } else {
    emptyEl.style.display = 'none';
    snap.forEach((docSnap) => {
      const data = docSnap.data();
      latestResources.push(data);
      listEl.appendChild(buildResourceItem(data));
    });
  }
}, () => {
  emptyEl.textContent = '자료 목록을 불러오지 못했습니다.';
  emptyEl.style.display = '';
});

function buildResourceItem(data) {
  const row = document.createElement('div');
  row.style.cssText = 'display:grid; grid-template-columns:minmax(0,1fr) 110px; gap:20px; padding:22px 0; border-bottom:1px solid #DCD4C6; align-items:center; cursor:pointer';
  row.addEventListener('mouseenter', () => { row.style.background = '#EFEADF'; });
  row.addEventListener('mouseleave', () => { row.style.background = ''; });

  const left = document.createElement('div');
  const title = document.createElement('div');
  title.style.cssText = 'font-size:16px; color:#1F1B16; margin-bottom:7px';
  title.textContent = data.title || '';
  const body = document.createElement('div');
  body.style.cssText = 'font-size:13px; color:#8C8071; line-height:1.7';
  body.textContent = [data.cat, data.date].filter(Boolean).join(' · ');
  left.appendChild(title);
  left.appendChild(body);

  const meta = document.createElement('div');
  meta.style.cssText = 'font-size:13px; color:#A2543A; text-align:right';
  meta.textContent = data.fileSize || '';

  row.appendChild(left);
  row.appendChild(meta);

  row.addEventListener('click', () => {
    const url = data.downloadUrl || '';
    if (!url.startsWith(GITHUB_PREFIX)) {
      alert('유효한 다운로드 링크가 등록되지 않았습니다.');
      return;
    }
    window.open(url, '_blank', 'noopener');
  });

  return row;
}

// ── 관리자 파일 등록 UI ────────────────────────────
initAuthObserver(({ isAdmin }) => {
  adminPanelEl.style.display = isAdmin ? '' : 'none';
  if (isAdmin && !adminPanelEl.dataset.built) {
    adminPanelEl.appendChild(buildAdminForm());
    adminPanelEl.dataset.built = '1';
  }
});

function buildAdminForm() {
  const wrap = document.createElement('div');

  const label = document.createElement('div');
  label.style.cssText = 'font-size:12px; letter-spacing:0.14em; color:#9A8F80; margin-bottom:18px';
  label.textContent = '자료 등록 (관리자)';
  wrap.appendChild(label);

  const fieldWrap = document.createElement('div');
  fieldWrap.style.cssText = 'display:flex; flex-direction:column; gap:10px; max-width:480px';

  const titleInput = document.createElement('input');
  titleInput.type = 'text';
  titleInput.placeholder = '제목';
  titleInput.style.cssText = FORM_INPUT_STYLE;

  const catInput = document.createElement('input');
  catInput.type = 'text';
  catInput.placeholder = '카테고리';
  catInput.style.cssText = FORM_INPUT_STYLE;

  const sizeInput = document.createElement('input');
  sizeInput.type = 'text';
  sizeInput.placeholder = '파일 크기 (예: 2.4MB)';
  sizeInput.style.cssText = FORM_INPUT_STYLE;

  const urlInput = document.createElement('input');
  urlInput.type = 'text';
  urlInput.placeholder = 'https://github.com/ 로 시작하는 다운로드 URL';
  urlInput.style.cssText = FORM_INPUT_STYLE;

  const msgEl = document.createElement('div');
  msgEl.style.cssText = 'font-size:12px; color:#A2543A; min-height:16px';

  const submitBtn = document.createElement('button');
  submitBtn.type = 'button';
  submitBtn.textContent = '자료 등록';
  submitBtn.style.cssText = 'align-self:flex-start; border:1px solid #1F1B16; background:none; color:#1F1B16; font-size:13px; padding:9px 20px; cursor:pointer; font-family:inherit';

  submitBtn.addEventListener('click', () => {
    handleResourceSubmit({ titleInput, catInput, sizeInput, urlInput, msgEl, submitBtn });
  });

  fieldWrap.appendChild(titleInput);
  fieldWrap.appendChild(catInput);
  fieldWrap.appendChild(sizeInput);
  fieldWrap.appendChild(urlInput);
  fieldWrap.appendChild(msgEl);
  fieldWrap.appendChild(submitBtn);
  wrap.appendChild(fieldWrap);

  return wrap;
}

async function handleResourceSubmit({ titleInput, catInput, sizeInput, urlInput, msgEl, submitBtn }) {
  msgEl.textContent = '';

  const title = titleInput.value.trim();
  const cat = catInput.value.trim();
  const fileSize = sizeInput.value.trim();
  const downloadUrl = urlInput.value.trim();

  if (!title || !cat || !fileSize || !downloadUrl) {
    msgEl.textContent = '모든 항목을 입력해 주십시오.';
    return;
  }
  if (!downloadUrl.startsWith(GITHUB_PREFIX)) {
    msgEl.textContent = 'https://github.com/ 로 시작하는 URL만 등록할 수 있습니다.';
    return;
  }

  const maxNo = latestResources.reduce((m, r) => Math.max(m, r.no || 0), 0);

  submitBtn.disabled = true;
  try {
    await addDoc(col('resources'), {
      no: maxNo + 1,
      cat,
      title,
      date: todayIso(),
      downloadUrl,
      fileSize,
      createdAt: serverTimestamp(),
    });
    titleInput.value = '';
    catInput.value = '';
    sizeInput.value = '';
    urlInput.value = '';
  } catch (e) {
    msgEl.textContent = '자료 등록에 실패했습니다.';
  } finally {
    submitBtn.disabled = false;
  }
}
</script>
