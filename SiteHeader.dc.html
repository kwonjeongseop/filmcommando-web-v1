<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:120}}">
class Component extends DCLogic {
  componentDidMount() {
    import('./auth.js').then((mod) => {
      mod.initAuthObserver((state) => {
        this.setState({
          email: state.user ? state.user.email : null,
          isAdmin: !!state.isAdmin,
        });
      });
    });
    const toggle = document.getElementById('fc-toggle');
    const mobileNav = document.getElementById('fc-nav-mobile');
    if (toggle && mobileNav) {
      toggle.addEventListener('click', () => {
        toggle.classList.toggle('open');
        mobileNav.classList.toggle('open');
      });
    }
  }
  handleLogout(e) {
    if (e && e.preventDefault) e.preventDefault();
    import('./auth.js').then((mod) => {
      mod.signOutUser().then(() => { window.location.href = './Home.dc.html'; });
    });
  }
  renderVals() {
    const email = (this.state && this.state.email) || null;
    const isAdmin = !!(this.state && this.state.isAdmin);
    return {
      loggedIn: !!email,
      loggedOut: !email,
      isAdmin,
      userEmail: email ? email.split('@')[0] : '',
      onLogout: (e) => this.handleLogout(e),
    };
  }
}
</script>
