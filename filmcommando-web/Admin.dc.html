<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>필름특공대 — 관리자</title>
<script src="./support.js"></script>
<script src="./page-transition.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #E7E2D8;
    font-family: 'Gowun Dodum', sans-serif;
    color: #1F1B16;
    min-height: 100vh;
  }
  #admin-root { display: none; }
  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 40px;
    background: #F4F1EA;
    border-bottom: 1px solid #C9C0B0;
  }
  .admin-logo {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .admin-user {
    font-size: 13px;
    color: #6E6357;
  }
  .admin-body {
    padding: 40px;
  }
  .admin-title {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 24px;
  }
  .booking-table {
    width: 100%;
    border-collapse: collapse;
    background: #F4F1EA;
    font-size: 14px;
  }
  .booking-table th, .booking-table td {
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid #DCD4C6;
  }
  .booking-table th {
    color: #6E6357;
    font-size: 12px;
    letter-spacing: 0.08em;
  }
  .empty-msg, .loading-msg {
    font-size: 14px;
    color: #8C8071;
    padding: 20px 0;
  }
  .back-link {
    color: #8C8071;
    text-decoration: none;
    font-size: 13px;
  }
  .back-link:hover { color: #A2543A; }

  /* 탭 네비게이션 */
  .admin-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    margin-bottom: 28px;
    border-bottom: 1px solid #DCD4C6;
  }
  .admin-tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 12px 4px;
    margin-right: 24px;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 15px;
    color: #8C8071;
    cursor: pointer;
  }
  .admin-tab-btn.active { color: #1F1B16; border-bottom-color: #A2543A; }
  .admin-tab-btn:hover { color: #1F1B16; }

  .admin-panel { display: none; }
  .admin-panel.active { display: block; }

  /* 공용 폼·버튼·리스트 */
  .admin-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 520px;
    margin-bottom: 32px;
    padding-bottom: 28px;
    border-bottom: 1px solid #1F1B16;
  }
  .admin-input, .admin-textarea {
    border: 1px solid #C9C0B0;
    background: #F4F1EA;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: #1F1B16;
  }
  .admin-btn {
    border: 1px solid #1F1B16;
    background: none;
    color: #1F1B16;
    font-size: 13px;
    padding: 8px 16px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .admin-btn:hover:not(:disabled) { background: #1F1B16; color: #F4F1EA; }
  .admin-btn:disabled { opacity: 0.5; cursor: default; }
  .admin-btn-danger { border-color: #A2543A; color: #A2543A; }
  .admin-btn-danger:hover:not(:disabled) { background: #A2543A; color: #F7F3EA; }

  .admin-list-row {
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid #DCD4C6;
    align-items: center;
  }

  .users-table {
    width: 100%;
    border-collapse: collapse;
    background: #F4F1EA;
    font-size: 14px;
  }
  .users-table th, .users-table td {
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid #DCD4C6;
    white-space: nowrap;
  }
  .users-table th {
    color: #6E6357;
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  @media (max-width:1400px) {
    .admin-header { padding: 20px 24px; }
    .admin-body { padding: 24px; }
    .booking-table { font-size: 13px; }
    .users-table { font-size: 13px; }
  }

  @media (max-width:480px) {
    .admin-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding: 16px 20px;
    }
    .admin-body { padding: 16px; }
    .admin-title { font-size: 20px; margin-bottom: 16px; }
    .admin-tab-btn { font-size: 13px; padding: 10px 2px; margin-right: 14px; }
    .admin-list-row { grid-template-columns: minmax(0,1fr); }

    .booking-table thead { display: none; }
    .booking-table, .booking-table tbody,
    .booking-table tr, .booking-table td {
      display: block;
      width: 100%;
      box-sizing: border-box;
    }
    .booking-table tr {
      margin-bottom: 14px;
      border: 1px solid #DCD4C6;
      border-radius: 4px;
      padding: 10px 14px;
      background: #F4F1EA;
    }
    .booking-table td {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: none;
    }
    .booking-table td:not(:last-child) {
      border-bottom: 1px solid #EDE7DC;
    }
    .booking-table td::before {
      color: #8C8071;
      font-size: 12px;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .booking-table td:nth-child(1)::before { content: "이름"; }
    .booking-table td:nth-child(2)::before { content: "연락처"; }
    .booking-table td:nth-child(3)::before { content: "주소"; }
    .booking-table td:nth-child(4)::before { content: "평형·연식"; }
    .booking-table td:nth-child(5)::before { content: "상담방식"; }
    .booking-table td:nth-child(6)::before { content: "일시"; }
    .booking-table td:nth-child(7)::before { content: "메모"; }
    .booking-table td:nth-child(8)::before { content: "상태"; }
    .booking-table td:nth-child(9)::before { content: "관리"; }
  }
</style>
</head>
<body>
<x-dc>
<div id="admin-root">
  <div class="admin-header">
    <div class="admin-logo">필름특공대 관리자</div>
    <div style="display:flex; align-items:center; gap:20px">
      <span class="admin-user" id="admin-user"></span>
      <a href="./Home.dc.html" class="back-link">← 홈으로</a>
    </div>
  </div>
  <div class="admin-body">
    <div class="admin-tabs">
      <button type="button" class="admin-tab-btn active" data-tab="bookings">예약관리</button>
      <button type="button" class="admin-tab-btn" data-tab="notices">공지관리</button>
      <button type="button" class="admin-tab-btn" data-tab="resources">자료관리</button>
      <button type="button" class="admin-tab-btn" data-tab="users">회원조회</button>
      <button type="button" class="admin-tab-btn" data-tab="backup">백업</button>
    </div>

    <div class="admin-panel active" id="panel-bookings">
      <div class="admin-title">상담 예약 목록</div>
      <div id="booking-status" class="loading-msg">불러오는 중...</div>
      <table class="booking-table" id="booking-table" style="display:none">
        <thead>
          <tr>
            <th>이름</th>
            <th>연락처</th>
            <th>주소</th>
            <th>평형·연식</th>
            <th>상담방식</th>
            <th>일시</th>
            <th>메모</th>
            <th>상태</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="booking-tbody"></tbody>
      </table>
    </div>

    <div class="admin-panel" id="panel-notices">
      <div class="admin-title">공지 관리</div>
      <div class="admin-form">
        <input class="admin-input" id="notice-title-input" type="text" placeholder="제목">
        <input class="admin-input" id="notice-cat-input" type="text" placeholder="카테고리">
        <input class="admin-input" id="notice-date-input" type="text" placeholder="날짜 (YYYY-MM-DD)">
        <textarea class="admin-textarea" id="notice-content-input" rows="3" placeholder="본문"></textarea>
        <div id="notice-form-msg" style="font-size:12px; color:#A2543A; min-height:16px"></div>
        <button type="button" class="admin-btn" id="notice-submit-btn" style="align-self:flex-start">공지 등록</button>
      </div>
      <div id="notice-status" class="loading-msg">불러오는 중...</div>
      <div id="notice-admin-list"></div>
    </div>

    <div class="admin-panel" id="panel-resources">
      <div class="admin-title">자료 관리</div>
      <div id="resource-status" class="loading-msg">불러오는 중...</div>
      <div id="resource-admin-list"></div>
    </div>

    <div class="admin-panel" id="panel-users">
      <div class="admin-title">회원 조회</div>
      <div id="users-status" class="loading-msg">불러오는 중...</div>
      <div style="overflow-x:auto">
        <table class="users-table" id="users-table" style="display:none">
          <thead>
            <tr>
              <th>UID</th>
              <th>이름</th>
              <th>연락처</th>
              <th>권한</th>
              <th>가입일</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="admin-panel" id="panel-backup">
      <div class="admin-title">백업</div>
      <p style="font-size:14px; line-height:1.9; color:#5D5346; max-width:560px; margin:0 0 20px">Firestore 데이터 백업 및 재해복구는 Firebase 콘솔에서 관리합니다. 아래 링크에서 자동 백업 일정 설정과 시점별 복원(Point-in-time recovery)을 확인할 수 있습니다.</p>
      <a href="https://console.firebase.google.com/u/0/project/filmcommando-f28bd/firestore/databases/-default-/backups" target="_blank" rel="noopener" class="admin-btn" style="display:inline-block">Firebase 콘솔 — 백업 관리 열기</a>
    </div>
  </div>
</div>

<script type="module">
import { db } from './firebase-config.js';
import { initAuthObserver } from './auth.js';
import {
  collection, query, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc, getDocs, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const GITHUB_PREFIX = 'https://github.com/';

function formatDate(d) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate());
}

// ── 탭 전환 ───────────────────────────────────────
const tabBtns = document.querySelectorAll('.admin-tab-btn');
const panels = document.querySelectorAll('.admin-panel');
tabBtns.forEach((btn) => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    tabBtns.forEach((b) => b.classList.toggle('active', b === btn));
    panels.forEach((p) => p.classList.toggle('active', p.id === 'panel-' + tab));
    if (tab === 'users') loadUsers();
  });
});

// ── (1) 예약관리 ──────────────────────────────────
const root = document.getElementById('admin-root');
const userLabel = document.getElementById('admin-user');

const bookingStatusEl = document.getElementById('booking-status');
const bookingTableEl  = document.getElementById('booking-table');
const bookingTbodyEl  = document.getElementById('booking-tbody');

const BOOKING_STATUS_FLOW  = ['pending', 'confirmed', 'done'];
const BOOKING_STATUS_LABEL = { pending: '대기', confirmed: '확정', done: '완료' };

function buildBookingRow(id, b) {
  const tr = document.createElement('tr');
  const cols = [b.name, b.phone, b.address, b.homeInfo, b.mode,
    (b.day ? b.day + '일 ' : '') + (b.slot || ''), b.memo];
  cols.forEach((v) => {
    const td = document.createElement('td');
    td.textContent = v || '';
    tr.appendChild(td);
  });

  const status = BOOKING_STATUS_FLOW.includes(b.status) ? b.status : 'pending';
  const statusIdx = BOOKING_STATUS_FLOW.indexOf(status);

  const statusTd = document.createElement('td');
  const statusBtn = document.createElement('button');
  statusBtn.type = 'button';
  statusBtn.className = 'admin-btn';
  statusBtn.textContent = BOOKING_STATUS_LABEL[status];
  if (statusIdx >= BOOKING_STATUS_FLOW.length - 1) {
    statusBtn.disabled = true;
  } else {
    statusBtn.addEventListener('click', async () => {
      statusBtn.disabled = true;
      try {
        await updateDoc(doc(db, 'bookings', id), { status: BOOKING_STATUS_FLOW[statusIdx + 1] });
      } catch (e) {
        statusBtn.disabled = false;
      }
    });
  }
  statusTd.appendChild(statusBtn);
  tr.appendChild(statusTd);

  const actionTd = document.createElement('td');
  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'admin-btn admin-btn-danger';
  delBtn.textContent = '삭제';
  delBtn.addEventListener('click', async () => {
    if (!confirm('이 예약을 삭제하시겠습니까?')) return;
    delBtn.disabled = true;
    try {
      await deleteDoc(doc(db, 'bookings', id));
    } catch (e) {
      delBtn.disabled = false;
    }
  });
  actionTd.appendChild(delBtn);
  tr.appendChild(actionTd);

  return tr;
}

function loadBookings() {
  onSnapshot(collection(db, 'bookings'), (snap) => {
    bookingTbodyEl.textContent = '';
    if (snap.empty) {
      bookingStatusEl.textContent = '등록된 예약이 없습니다.';
      bookingStatusEl.style.display = '';
      bookingTableEl.style.display = 'none';
      return;
    }
    snap.forEach((d) => bookingTbodyEl.appendChild(buildBookingRow(d.id, d.data())));
    bookingStatusEl.style.display = 'none';
    bookingTableEl.style.display = '';
  }, () => {
    bookingStatusEl.textContent = '예약 목록을 불러오지 못했습니다.';
    bookingStatusEl.style.display = '';
  });
}

// ── (2) 공지관리 ──────────────────────────────────
const noticeStatusEl = document.getElementById('notice-status');
const noticeListEl   = document.getElementById('notice-admin-list');
let latestNotices = [];

function buildNoticeAdminRow(id, data) {
  const row = document.createElement('div');
  row.className = 'admin-list-row';

  const left = document.createElement('div');
  const title = document.createElement('div');
  title.style.cssText = 'font-size:15px; color:#1F1B16; margin-bottom:4px';
  title.textContent = data.title || '';
  const meta = document.createElement('div');
  meta.style.cssText = 'font-size:12px; color:#9A8F80';
  meta.textContent = [data.cat, data.date].filter(Boolean).join(' · ');
  left.appendChild(title);
  left.appendChild(meta);

  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'admin-btn admin-btn-danger';
  delBtn.textContent = '삭제';
  delBtn.addEventListener('click', async () => {
    if (!confirm('이 공지를 삭제하시겠습니까?')) return;
    delBtn.disabled = true;
    try {
      await deleteDoc(doc(db, 'notices', id));
    } catch (e) {
      delBtn.disabled = false;
    }
  });

  row.appendChild(left);
  row.appendChild(delBtn);
  return row;
}

function loadNotices() {
  onSnapshot(query(collection(db, 'notices'), orderBy('no', 'desc')), (snap) => {
    latestNotices = [];
    noticeListEl.textContent = '';
    if (snap.empty) {
      noticeStatusEl.textContent = '등록된 공지가 없습니다.';
      noticeStatusEl.style.display = '';
    } else {
      noticeStatusEl.style.display = 'none';
      snap.forEach((d) => {
        latestNotices.push(d.data());
        noticeListEl.appendChild(buildNoticeAdminRow(d.id, d.data()));
      });
    }
  }, () => {
    noticeStatusEl.textContent = '공지 목록을 불러오지 못했습니다.';
    noticeStatusEl.style.display = '';
  });
}

const noticeTitleInput   = document.getElementById('notice-title-input');
const noticeCatInput     = document.getElementById('notice-cat-input');
const noticeDateInput    = document.getElementById('notice-date-input');
const noticeContentInput = document.getElementById('notice-content-input');
const noticeMsgEl        = document.getElementById('notice-form-msg');
const noticeSubmitBtn    = document.getElementById('notice-submit-btn');

noticeSubmitBtn.addEventListener('click', async () => {
  noticeMsgEl.textContent = '';
  const title   = noticeTitleInput.value.trim();
  const cat     = noticeCatInput.value.trim();
  const date    = noticeDateInput.value.trim();
  const content = noticeContentInput.value.trim();

  if (!title || !cat || !date) {
    noticeMsgEl.textContent = '제목/카테고리/날짜는 필수입니다.';
    return;
  }

  const maxNo = latestNotices.reduce((m, n) => Math.max(m, n.no || 0), 0);
  noticeSubmitBtn.disabled = true;
  try {
    await addDoc(collection(db, 'notices'), {
      no: maxNo + 1,
      cat,
      title,
      date,
      content: content || '(내용 없음)',
      createdAt: serverTimestamp(),
    });
    noticeTitleInput.value = '';
    noticeCatInput.value = '';
    noticeDateInput.value = '';
    noticeContentInput.value = '';
  } catch (e) {
    noticeMsgEl.textContent = '공지 등록에 실패했습니다.';
  } finally {
    noticeSubmitBtn.disabled = false;
  }
});

// ── (3) 자료관리 ──────────────────────────────────
const resourceStatusEl = document.getElementById('resource-status');
const resourceListEl   = document.getElementById('resource-admin-list');

function buildResourceAdminRow(id, data) {
  const row = document.createElement('div');
  row.className = 'admin-list-row';
  row.style.gridTemplateColumns = 'minmax(0,1fr) minmax(0,240px) auto auto';

  const left = document.createElement('div');
  const title = document.createElement('div');
  title.style.cssText = 'font-size:15px; color:#1F1B16; margin-bottom:4px';
  title.textContent = data.title || '';
  const meta = document.createElement('div');
  meta.style.cssText = 'font-size:12px; color:#9A8F80';
  meta.textContent = [data.cat, data.fileSize].filter(Boolean).join(' · ');
  left.appendChild(title);
  left.appendChild(meta);

  const urlInput = document.createElement('input');
  urlInput.type = 'text';
  urlInput.className = 'admin-input';
  urlInput.value = data.downloadUrl || '';
  urlInput.placeholder = 'https://github.com/...';

  const saveBtn = document.createElement('button');
  saveBtn.type = 'button';
  saveBtn.className = 'admin-btn';
  saveBtn.textContent = '저장';
  saveBtn.addEventListener('click', async () => {
    const url = urlInput.value.trim();
    if (!url.startsWith(GITHUB_PREFIX)) {
      alert('https://github.com/ 로 시작하는 URL만 저장할 수 있습니다.');
      return;
    }
    saveBtn.disabled = true;
    try {
      await updateDoc(doc(db, 'resources', id), { downloadUrl: url });
    } catch (e) {
      alert('저장에 실패했습니다.');
    } finally {
      saveBtn.disabled = false;
    }
  });

  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'admin-btn admin-btn-danger';
  delBtn.textContent = '삭제';
  delBtn.addEventListener('click', async () => {
    if (!confirm('이 자료를 삭제하시겠습니까?')) return;
    delBtn.disabled = true;
    try {
      await deleteDoc(doc(db, 'resources', id));
    } catch (e) {
      delBtn.disabled = false;
    }
  });

  row.appendChild(left);
  row.appendChild(urlInput);
  row.appendChild(saveBtn);
  row.appendChild(delBtn);
  return row;
}

function loadResources() {
  onSnapshot(query(collection(db, 'resources'), orderBy('no', 'desc')), (snap) => {
    resourceListEl.textContent = '';
    if (snap.empty) {
      resourceStatusEl.textContent = '등록된 자료가 없습니다.';
      resourceStatusEl.style.display = '';
    } else {
      resourceStatusEl.style.display = 'none';
      snap.forEach((d) => resourceListEl.appendChild(buildResourceAdminRow(d.id, d.data())));
    }
  }, () => {
    resourceStatusEl.textContent = '자료 목록을 불러오지 못했습니다.';
    resourceStatusEl.style.display = '';
  });
}

// ── (4) 회원조회 ──────────────────────────────────
const usersStatusEl = document.getElementById('users-status');
const usersTableEl  = document.getElementById('users-table');
const usersTbodyEl  = document.getElementById('users-tbody');
let usersLoaded = false;

function buildUserRow(uid, data) {
  const tr = document.createElement('tr');
  const created = (data.createdAt && data.createdAt.toDate) ? formatDate(data.createdAt.toDate()) : '';
  const shortUid = uid.slice(0, 8) + '...';
  [shortUid, data.name, data.phone, data.role, created].forEach((v) => {
    const td = document.createElement('td');
    td.textContent = v || '';
    tr.appendChild(td);
  });
  return tr;
}

async function loadUsers() {
  if (usersLoaded) return;
  usersLoaded = true;
  try {
    const snap = await getDocs(collection(db, 'users'));
    if (snap.empty) {
      usersStatusEl.textContent = '등록된 회원이 없습니다.';
      return;
    }
    usersTbodyEl.textContent = '';
    snap.forEach((d) => usersTbodyEl.appendChild(buildUserRow(d.id, d.data())));
    usersStatusEl.style.display = 'none';
    usersTableEl.style.display = '';
  } catch (e) {
    usersStatusEl.textContent = '회원 목록을 불러오지 못했습니다.';
  }
}

// ── 관리자 인증 게이트 ─────────────────────────────
initAuthObserver(({ user, isAdmin }) => {
  if (!user || !isAdmin) {
    window.location.href = './Home.dc.html';
    return;
  }
  userLabel.textContent = user.email || '';
  root.style.display = '';
  loadBookings();
  loadNotices();
  loadResources();
});
</script>
</x-dc>
