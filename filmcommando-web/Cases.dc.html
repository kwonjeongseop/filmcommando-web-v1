<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>필름특공대 — 시공 사례</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  html, body { margin:0; padding:0; background:#F4F1EA; }
  * { box-sizing:border-box; }
  a { color:#1F1B16; text-decoration:none; }
  a:hover { color:#A2543A; }
  ::selection { background:#1F1B16; color:#F4F1EA; }

  /* Cases 반응형 */
  @media (max-width:768px) {
    .fc-cases-wrap {
      min-width:0 !important;
      padding:40px 20px 80px !important;
    }
    .fc-cases-hero {
      grid-template-columns:1fr !important;
    }
    .fc-cases-filter {
      grid-template-columns:1fr !important;
    }
    .fc-cases-grid {
      grid-template-columns:1fr !important;
    }
    .fc-cases-compare {
      grid-template-columns:1fr !important;
    }
    .fc-cases-summary {
      grid-template-columns:1fr 1fr !important;
    }
    .fc-cases-img {
      height:200px !important;
    }
    .fc-cases-cta {
      flex-direction:column !important;
      align-items:center !important;
      text-align:center !important;
      gap:24px !important;
    }
  }
  @media (max-width:480px) {
    .fc-cases-summary {
      grid-template-columns:1fr !important;
    }
    .fc-cases-img {
      height:180px !important;
    }
  }

  @media (min-width:769px) and (max-width:1100px) {
    .fc-cases-hero {
      grid-template-columns: minmax(0,1fr) !important;
      gap: 24px !important;
    }
    .fc-cases-hero > div:first-child {
      display: none !important;
    }
  }
  @media (min-width:1101px) and (max-width:1300px) {
    .fc-cases-hero {
      grid-template-columns: minmax(0,1fr) minmax(0,320px) !important;
      gap: 40px !important;
    }
    .fc-cases-hero > div:first-child {
      display: none !important;
    }
  }
</style>
<script src="./page-transition.js"></script>
</helmet>

<div class="fc-cases-wrap" style="font-family:'Gowun Dodum',sans-serif; color:#1F1B16; background:#F4F1EA">
  <dc-import name="SiteHeader" hint-size="100%,113px"></dc-import>

  <section class="fc-cases-hero" style="padding:72px 56px 60px; border-bottom:1px solid #DCD4C6; display:grid; grid-template-columns:190px minmax(0,1fr) minmax(0,380px); gap:56px; align-items:end">
    <div style="font-size:12px; letter-spacing:0.2em; color:#9A8F80">시공 사례</div>
    <h1 style="font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:46px; line-height:1.32; letter-spacing:-0.04em; margin:0">준공한 집을<br>공정과 함께 적었습니다</h1>
    <p style="font-size:15px; line-height:2; color:#5D5346; margin:0; text-wrap:pretty">범위 · 지역 · 평형으로 찾아보실 수 있습니다. 사진은 촬영 동의를 받은 현장만 공개합니다.</p>
  </section>

  <section class="fc-cases-filter" style="padding:28px 56px; border-bottom:1px solid #DCD4C6; display:grid; grid-template-columns:110px minmax(0,1fr); gap:28px; align-items:center">
    <div style="font-size:12px; letter-spacing:0.14em; color:#9A8F80">범위</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap">
      <sc-for list="{{ scopes }}" as="f" hint-placeholder-count="5">
        <span style="border:1px solid #DCD4C6; color:#5D5346; font-size:14px; padding:9px 16px; cursor:pointer" style-hover="border-color:#1F1B16; color:#1F1B16">{{ f }}</span>
      </sc-for>
    </div>
  </section>

  <section class="fc-cases-filter" style="padding:20px 56px 24px; border-bottom:1px solid #DCD4C6; display:grid; grid-template-columns:110px minmax(0,1fr); gap:28px; align-items:center">
    <div style="font-size:12px; letter-spacing:0.14em; color:#9A8F80">지역</div>
    <div style="display:flex; justify-content:space-between; align-items:center; gap:30px">
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <sc-for list="{{ regions }}" as="r" hint-placeholder-count="8">
          <span style="border:1px solid #DCD4C6; color:#5D5346; font-size:14px; padding:9px 16px; cursor:pointer" style-hover="border-color:#1F1B16; color:#1F1B16">{{ r }}</span>
        </sc-for>
      </div>
      <span id="cs-count" style="font-size:13px;
        color:#9A8F80; flex:none"></span>
    </div>
  </section>

  <section style="padding:56px 56px 40px">
    <div id="cs-grid" class="fc-cases-grid" style="display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:44px 36px"></div>
    <p id="cs-empty" style="display:none;
      color:#9A8F80; font-size:15px;
      padding:60px 0; text-align:center">
      등록된 사례가 없습니다.</p>
  </section>

  <section style="background:#EFEADF; border-top:1px solid #DCD4C6; border-bottom:1px solid #DCD4C6">
    <div style="padding:64px 56px; display:grid; grid-template-columns:190px minmax(0,1fr); gap:56px">
      <div style="font-size:12px; letter-spacing:0.2em; color:#9A8F80; padding-top:6px">사례 요약</div>
      <div id="cs-stats"
        class="fc-cases-summary"
        style="display:grid;
        grid-template-columns:repeat(4,minmax(0,1fr));
        gap:40px"></div>
    </div>
  </section>

  <section style="background:#221E19; color:#EDE7DC">
    <div class="fc-cases-cta" style="padding:70px 56px; display:flex; justify-content:space-between; align-items:center; gap:40px">
      <div>
        <h2 style="font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:31px; letter-spacing:-0.035em; margin:0 0 12px; color:#F7F3EA">비슷한 집의 견적서를 보여드립니다</h2>
        <p style="font-size:15px; line-height:1.9; color:#B0A595; margin:0">평형과 연식, 희망 범위를 알려주시면 유사 사례의 공정별 금액과 일정표를 정리해 드립니다.</p>
      </div>
      <div style="display:flex; gap:12px; flex:none">
        <a href="./Estimator.dc.html" style="border:1px solid #4A4238; color:#EDE7DC; font-size:15px; padding:18px 28px" style-hover="border-color:#A2543A">견적 계산기</a>
        <a href="./Quote.dc.html" style="background:#EDE7DC; color:#221E19; font-size:15px; padding:18px 32px" style-hover="background:#A2543A; color:#F7F3EA">견적 접수</a>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>

  <script type="module">
import { db } from './firebase-config.js';
import {
  collection, query, where, orderBy,
  onSnapshot, doc
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || ''; return d.innerHTML;
}
function imgSlot(url, label) {
  return url
    ? '<img src="' + esc(url) + '"' +
      ' style="width:100%;height:100%;' +
      'object-fit:cover;display:block"' +
      ' alt="' + esc(label) + '">'
    : '<div style="width:100%;height:100%;' +
      'background:#E6DFD2;display:flex;' +
      'align-items:center;justify-content:center;' +
      'font-size:12px;color:#9A8F80">' +
      esc(label) + '</div>';
}
function renderCases(cases) {
  const grid  = document.getElementById('cs-grid');
  const empty = document.getElementById('cs-empty');
  const count = document.getElementById('cs-count');
  if (!grid) return;
  if (!cases.length) {
    grid.innerHTML = '';
    if (empty) empty.style.display = '';
    if (count) count.textContent = '';
    return;
  }
  if (empty) empty.style.display = 'none';
  if (count) count.textContent =
    '전체 ' + cases.length + '건';
  grid.innerHTML = cases.map(c =>
    '<a href="./CaseDetail.dc.html?id=' +
    esc(c.id) + '" style="display:block">' +
    '<div class="fc-cases-compare"' +
    ' style="display:grid;' +
    'grid-template-columns:minmax(0,1fr) minmax(0,1fr);' +
    'gap:6px">' +
    '<figure style="margin:0">' +
    '<div class="fc-cases-img"' +
    ' style="position:relative;height:230px;overflow:hidden">' +
    imgSlot(c.photoBefore,'시공 전') + '</div>' +
    '<figcaption style="font-size:11px;' +
    'letter-spacing:0.12em;color:#9A8F80;' +
    'padding-top:8px;text-align:center">시공 전' +
    '</figcaption></figure>' +
    '<figure style="margin:0">' +
    '<div class="fc-cases-img"' +
    ' style="position:relative;height:230px;overflow:hidden">' +
    imgSlot(c.photoAfter,'시공 후') + '</div>' +
    '<figcaption style="font-size:11px;' +
    'letter-spacing:0.12em;color:#9A8F80;' +
    'padding-top:8px;text-align:center">시공 후' +
    '</figcaption></figure></div>' +
    '<div style="padding-top:18px;margin-top:18px;' +
    'border-top:1px solid #DCD4C6">' +
    '<div style="display:flex;' +
    'justify-content:space-between;' +
    'align-items:baseline;margin-bottom:11px">' +
    '<span style="font-size:12px;' +
    'letter-spacing:0.16em;color:#A2543A">' +
    esc(c.scope) + '</span>' +
    '<span style="font-size:12px;color:#B0A595">' +
    esc(c.date) + '</span></div>' +
    '<h2 style="font-family:\'Nanum Myeongjo\',serif;' +
    'font-size:21px;font-weight:700;' +
    'letter-spacing:-0.025em;margin:0 0 8px">' +
    esc(c.title) + '</h2>' +
    '<div style="font-size:14px;color:#9A8F80;' +
    'margin-bottom:11px">' + esc(c.tag) + '</div>' +
    '<p style="font-size:14px;line-height:1.9;' +
    'color:#5D5346;margin:0 0 12px;text-wrap:pretty">' +
    esc(c.body) + '</p>' +
    '<div style="font-size:13px;color:#8C8071">' +
    esc(c.meta) + '</div>' +
    '</div></a>'
  ).join('');
}
function renderStats(data) {
  const el = document.getElementById('cs-stats');
  if (!el) return;
  [
    { v: data.total   || '-', k: '누적 시공' },
    { v: data.avgDays || '-', k: '전예 평균 기간' },
    { v: data.onTime  || '-', k: '준공일 준수율' },
    { v: data.rating  || '-', k: '후기 평점' },
  ].forEach(s => {
    const div = document.createElement('div');
    div.innerHTML =
      '<div style="font-family:\'Nanum Myeongjo\',' +
      'serif;font-size:30px;font-weight:800;' +
      'letter-spacing:-0.04em">' + esc(s.v) + '</div>' +
      '<div style="font-size:13px;color:#8C8071;' +
      'margin-top:10px;line-height:1.7">' +
      esc(s.k) + '</div>';
    el.appendChild(div);
  });
}
document.addEventListener('DOMContentLoaded', () => {
  onSnapshot(
    query(collection(db,'cases'),
      where('visible','==',true),
      orderBy('order','asc')),
    snap => renderCases(
      snap.docs.map(d => ({id:d.id,...d.data()}))));
  onSnapshot(doc(db,'stats','cases'),
    snap => { if(snap.exists()) renderStats(snap.data()); });
});
  </script>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000}}">
class Component extends DCLogic {
  renderVals() {
    return {
      scopes: ["전체", "전예 리모델링", "부분 시공", "필름 단독", "상가 · 사무실"],
      regions: ["전체", "서울 강동 · 송파", "서울 성북 · 노원", "경기 성남 · 용인", "경기 부천 · 광명", "경기 고양 · 일산", "인천", "그 외"],
    };
  }
}

</script>
</body>
</html>
