<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>필름특공대 — 로그인</title>
<script src="./support.js"></script>
<script src="./page-transition.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #E7E2D8;
    font-family: 'Gowun Dodum', sans-serif;
    color: #1F1B16;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-wrap {
    width: 100%;
    max-width: 480px;
    padding: 48px 40px;
    background: #F4F1EA;
    box-shadow: 0 2px 4px rgba(31,27,22,0.06),
                0 24px 60px rgba(31,27,22,0.10);
  }
  .logo {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #1F1B16;
    margin-bottom: 32px;
    text-align: center;
  }
  .tab-wrap {
    display: flex;
    border-bottom: 1px solid #C9C0B0;
    margin-bottom: 32px;
  }
  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
    color: #8C8071;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: 'Gowun Dodum', sans-serif;
  }
  .tab.active {
    color: #A2543A;
    border-bottom-color: #A2543A;
  }
  .field {
    margin-bottom: 20px;
  }
  .field label {
    display: block;
    font-size: 13px;
    color: #6E6357;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #C9C0B0;
    background: #E7E2D8;
    font-size: 14px;
    font-family: 'Gowun Dodum', sans-serif;
    color: #1F1B16;
    box-sizing: border-box;
    outline: none;
  }
  .field input:focus {
    border-color: #A2543A;
  }
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: #1F1B16;
    color: #E7E2D8;
    font-size: 15px;
    font-family: 'Gowun Dodum', sans-serif;
    border: none;
    cursor: pointer;
    margin-top: 8px;
    letter-spacing: 0.04em;
  }
  .btn-submit:hover { background: #A2543A; }
  .msg {
    margin-top: 16px;
    font-size: 13px;
    text-align: center;
    min-height: 20px;
    color: #A2543A;
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: #8C8071;
    text-decoration: none;
  }
  .back-link:hover { color: #A2543A; }

  @media (max-width:768px) {
    .login-wrap {
      max-width: 400px;
    }
  }

  @media (max-width:480px) {
    .login-wrap {
      max-width: 100%;
      padding: 32px 24px;
    }
    .logo {
      font-size: 19px;
      margin-bottom: 24px;
    }
    .field input {
      padding: 11px 12px;
    }
    .btn-submit {
      padding: 13px;
    }
  }
</style>
</head>
<body>
<x-dc>
<div class="login-wrap">
  <div class="logo">필름특공대 REMODELING</div>
  <div class="tab-wrap">
    <button class="tab active" id="tab-login">로그인</button>
    <button class="tab" id="tab-signup">회원가입</button>
  </div>

  <!-- 로그인 폼 -->
  <div id="form-login">
    <div class="field">
      <label>이메일</label>
      <input type="email" id="login-email" autocomplete="email"
        placeholder="이메일 주소 입력">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="login-pw" autocomplete="current-password"
        placeholder="비밀번호 입력">
    </div>
    <button class="btn-submit" id="btn-login">로그인</button>
  </div>

  <!-- 회원가입 폼 -->
  <div id="form-signup" style="display:none">
    <div class="field">
      <label>이메일</label>
      <input type="email" id="signup-email" autocomplete="email"
        placeholder="이메일 주소 입력">
    </div>
    <div class="field">
      <label>비밀번호 (6자 이상)</label>
      <input type="password" id="signup-pw" autocomplete="new-password"
        placeholder="비밀번호 입력">
    </div>
    <div class="field">
      <label>비밀번호 확인</label>
      <input type="password" id="signup-pw2" autocomplete="new-password"
        placeholder="비밀번호 재입력">
    </div>
    <button class="btn-submit" id="btn-signup">회원가입</button>
  </div>

  <div class="msg" id="msg"></div>
  <a href="./Home.dc.html" class="back-link">← 홈으로 돌아가기</a>
</div>

<script type="module">
  import { signIn, signUp, getCachedUser }
    from './auth.js';

  // 이미 로그인된 경우 홈 이동
  if (getCachedUser()) {
    window.location.href = './Home.dc.html';
  }

  const msg = document.getElementById('msg');

  // 에러 코드 한국어 변환
  function errMsg(code) {
    const map = {
      'auth/invalid-email': '이메일 형식이 올바르지 않습니다.',
      'auth/user-not-found': '등록되지 않은 이메일입니다.',
      'auth/wrong-password': '비밀번호가 올바르지 않습니다.',
      'auth/invalid-credential': '이메일 또는 비밀번호를 확인해 주십시오.',
      'auth/email-already-in-use': '이미 사용 중인 이메일입니다.',
      'auth/weak-password': '비밀번호는 6자 이상이어야 합니다.',
      'auth/too-many-requests': '잠시 후 다시 시도해 주십시오.',
    };
    return map[code] || '오류가 발생했습니다. 다시 시도해 주십시오.';
  }

  // 탭 전환
  document.getElementById('tab-login').addEventListener('click', () => {
    document.getElementById('form-login').style.display = '';
    document.getElementById('form-signup').style.display = 'none';
    document.getElementById('tab-login').classList.add('active');
    document.getElementById('tab-signup').classList.remove('active');
    msg.textContent = '';
  });

  document.getElementById('tab-signup').addEventListener('click', () => {
    document.getElementById('form-login').style.display = 'none';
    document.getElementById('form-signup').style.display = '';
    document.getElementById('tab-signup').classList.add('active');
    document.getElementById('tab-login').classList.remove('active');
    msg.textContent = '';
  });

  // 로그인
  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const pw = document.getElementById('login-pw').value;
    if (!email || !pw) {
      msg.textContent = '이메일과 비밀번호를 입력해 주십시오.';
      return;
    }
    msg.textContent = '로그인 중...';
    const result = await signIn(email, pw);
    if (result.success) {
      window.location.href = './Home.dc.html';
    } else {
      msg.textContent = errMsg(result.error);
    }
  });

  // 회원가입
  document.getElementById('btn-signup').addEventListener('click', async () => {
    const email = document.getElementById('signup-email').value.trim();
    const pw = document.getElementById('signup-pw').value;
    const pw2 = document.getElementById('signup-pw2').value;
    if (!email || !pw || !pw2) {
      msg.textContent = '모든 항목을 입력해 주십시오.';
      return;
    }
    if (pw !== pw2) {
      msg.textContent = '비밀번호가 일치하지 않습니다.';
      return;
    }
    msg.textContent = '가입 중...';
    const result = await signUp(email, pw);
    if (result.success) {
      window.location.href = './Home.dc.html';
    } else {
      msg.textContent = errMsg(result.error);
    }
  });
</script>
</x-dc>
</body>
</html>
